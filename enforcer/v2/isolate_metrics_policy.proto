syntax = "proto3";

package enforcer.v2;

// Configuration for OTel metrics routing and filtering.
message IsolateMetricsPolicy {
  // The list of metrics that the isolate is permitted to emit.
  // Metrics not matching any entry in this list will be dropped.
  repeated AllowedMetric allowed_metrics = 1;
}

// Defines a single permitted metric and its allowed attributes.
message AllowedMetric {
  // The full name of the metric (e.g., "http.server.duration").
  string name = 1;
  // The expected type of the metric.
  enum MetricType {
    // Default value. Not a valid metric type.
    METRIC_TYPE_UNSPECIFIED = 0;
    // A Gauge metric.
    METRIC_TYPE_GAUGE = 1;
    // A Sum metric.
    METRIC_TYPE_SUM = 2;
    // A Histogram metric.
    METRIC_TYPE_HISTOGRAM = 3;
    // An Exponential Histogram metric.
    METRIC_TYPE_EXPONENTIAL_HISTOGRAM = 4;
    // A Summary metric.
    METRIC_TYPE_SUMMARY = 5;
  }
  // The type of the metric being defined.
  MetricType type = 2;
  // The list of attributes that are allowed for this metric.
  // If this list is empty, then all attributes are filtered out.
  repeated string allowed_attributes = 3;
}
