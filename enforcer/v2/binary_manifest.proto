syntax = "proto3";

package enforcer.v2;

import "enforcer/v2/common.proto";
import "enforcer/v2/ez_backend_dependencies.proto";
import "enforcer/v2/ez_service_spec.proto";
import "enforcer/v2/intercepting_services.proto";
import "enforcer/v2/isolate_metrics_policy.proto";

// Describes a single Isolate and the package it runs from.
message BinaryManifest {
  // Unique identification of the isolate by name and publisher.
  IsolateType isolate_type = 1;
  // Digests of the package file. Required for Ratified and Opaque Isolates;
  // unused for the Setup Isolate.
  IsolateDigest isolate_digest = 2;
  // Filename of this executable binary file
  string binary_filename = 3;
  // Label identifying the exact version of the binary used. EZ does not
  // use or enforce anything on this field, though it may be logged for
  // transparency purposes.
  string version_label = 4;
  // Specifications for any services this binary implements (not all services
  // may be active at runtime)
  repeated EzServiceSpec service_specs = 5;
  // Specifications for backend services or endpoints outside or inside EZ
  // that this isolate depends on and is permitted to communicate with.
  repeated EzBackendDependency ez_backend_dependencies = 6;
  // Command line arguments to be passed to the binary.
  repeated string command_line_arguments = 7;
  // Environment variables to be set for the binary.
  repeated string environment_variables = 8;

  // Kind-specific settings. Exactly one must be set.
  oneof isolate_kind {
    // The Setup Isolate.
    SetupControls setup = 9;
    // A Ratified Isolate.
    RatifiedControls ratified = 10;
    // An Opaque Isolate.
    OpaqueControls opaque = 11;
  }
}

// Digest/Hash of the Isolate's package (tar file). The provided Isolate
// package's digest must match these digests.
message IsolateDigest {
  // Lowercase hex SHA-256 of the package file.
  string package_sha256 = 1;
}

// Settings specific to the Setup Isolate.
message SetupControls {
  // Path to the Setup Isolate's package on the Enforcer's filesystem.
  string package_filename = 1;
}

// Settings specific to Ratified Isolates.
message RatifiedControls {
  // List of services for which this Ratified Isolate will intercept all
  // requests. Only one Interceptor is allowed to be configured for each
  // service. Requests originating from Ratified Isolates cannot be
  // intercepted.
  repeated InterceptingServices services_to_intercept = 1;
  // Policy that defines which metrics are allowed to be exported by the isolate.
  // If unset, no metrics are exported.
  IsolateMetricsPolicy metrics_policy = 2;
}

// Settings specific to Opaque Isolates.
message OpaqueControls {
  // Flags (starting with "-") and environment variable names that
  // IsolateStartupParameters may set.
  repeated string allowed_overrides = 1;
  // Policy that defines which metrics are allowed to be exported by the isolate.
  // If unset, no metrics are exported.
  IsolateMetricsPolicy metrics_policy = 2;
}
