syntax = "proto3";

package enforcer.v2;

// Services for which all requests will be intercepted by a Ratified Isolate.
// Intercepting is the service that is being intercepted. Interceptor is the
// Ratified Isolate service that will receive all requests intended for the
// Intercepting service.
message InterceptingServices {
  // These fields should match from the Intercepting service's BinaryManifest
  // when it's an Opaque Isolate. For external services, these should match the
  // EzBackendDependency values.
  string intercepting_operator_domain = 1;
  string intercepting_publisher_id = 2;
  string intercepting_isolate_name = 3;
  string intercepting_service_name = 4;
  // These fields should match the Ratified Isolate's BinaryManifest
  string interceptor_operator_domain = 5;
  string interceptor_publisher_id = 6;
  string interceptor_isolate_name = 7;
  string interceptor_service_name = 8;
  // The Ratified Isolate method that will be used to intercept all unary
  // methods for the matching Intercepting service.
  string interceptor_method_for_unary = 9;
  // The Ratified Isolate method that will be used to intercept all streaming
  // methods for the matching Intercepting service.
  string interceptor_method_for_streaming = 10;
}
