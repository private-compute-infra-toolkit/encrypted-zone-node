syntax = "proto3";

package enforcer.v2;

import "enforcer/v2/ez_backend_dependencies.proto";
import "enforcer/v2/ez_service_spec.proto";
import "enforcer/v2/intercepting_services.proto";
import "enforcer/v2/isolate_metrics_policy.proto";

// Describes a Setup Isolate manifest containing a single SetupIsolateDescriptor.
message SetupIsolateManifest {
  SetupIsolateDescriptor setup_isolate_descriptor = 1;
}

// Describes a binary to be run inside a Setup Isolate, and the services that
// Isolate will expose.
message SetupIsolateDescriptor {
  // The name of the current workload as chosen by the publisher.
  string isolate_name = 1;
  // Must match domain in the cert that signs this package. Need not match the
  // domain of the machine installing the package.
  string publisher_id = 2;
  // An arbitrary but unique filename (POSIX-compatible) to use for this
  // package. The filename is how other packages will expect to find this
  // package in a bundle.
  //
  // Example: acme.com-ads-backend1-v1.09012024.3.ezpkg
  string package_filename = 3;
  // Filename of this executable binary file
  string binary_filename = 4;
  // Command line arguments to be passed to the binary
  // May reference a set of pre-defined environment variables (and only those).
  // TODO: Link to a doc itemizing the allowlisted variables
  repeated string command_line_arguments = 5;
  // Size in bytes of the decompressed archive containing the binary
  int64 unpacked_archive_size = 6;
  // Disk space (in bytes) needed at runtime. Typically this is
  // unpacked_archive_size + any extra tmp space needed to start the binary.
  int64 disk_reservation_size = 7;
  // Specifications for any services this binary implements (not all services
  // may be active at runtime)
  repeated EzServiceSpec service_specs = 8;
  repeated EzBackendDependency ez_backend_dependencies = 9;
  // Environment variables to be set.
  repeated string environment_variables = 10;
  // Number of Isolates that will be maintained for this binary.
  // Note: This field will be deprecated in favor of dynamic number of instances
  // in the future.
  int32 number_of_isolates = 11;
  // List of services for which this Isolate will intercept all
  // requests. Only Ratified Isolates are allowed to provide this field. Only
  // one Interceptor is allowed to be configured for each service. Requests
  // originating from Ratified Isolates cannot be intercepted.
  repeated InterceptingServices services_to_intercept = 12;
  // Policy that defines which metrics are allowed to be exported by the isolate.
  // If unset, no metrics are exported.
  IsolateMetricsPolicy metrics_policy = 13;
  // TODO: Add specs for other dependencies, such as Data or KeyMaterial
}
