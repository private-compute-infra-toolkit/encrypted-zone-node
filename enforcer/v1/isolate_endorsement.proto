syntax = "proto3";

package enforcer.v1;

import "google/protobuf/timestamp.proto";

// Represents the validity time range for an endorsement.
// Note: To account for potential clock drift, implementations should accept
// minor clock skews (e.g., up to a few minutes) when validating these timestamps.
message Validity {
  // Timestamp before which the endorsement is not valid.
  google.protobuf.Timestamp not_before = 1;
  // Timestamp after which the endorsement is not valid.
  google.protobuf.Timestamp not_after = 2;
}

// Response containing the isolate package endorsement validation result.
message ValidateIsolateEndorsementResponse {
  // Errors that can occur during isolate endorsement validation.
  enum IsolateEndorsementValidationError {
    // Unspecified validation error.
    ISOLATE_ENDORSEMENT_VALIDATION_ERROR_UNSPECIFIED = 0;
    // Failed to parse the endorsement, confirmation JSON, keyset, or claims.
    ISOLATE_ENDORSEMENT_VALIDATION_ERROR_PARSING_FAILURE = 1;
    // Publisher ID in the endorsement does not match the expected publisher ID.
    ISOLATE_ENDORSEMENT_VALIDATION_ERROR_PUBLISHER_ID_MISMATCH = 2;
    // Workload ID in the endorsement does not match the expected isolate name.
    ISOLATE_ENDORSEMENT_VALIDATION_ERROR_ISOLATE_NAME_MISMATCH = 3;
    // Cryptographic endorsement verification failed.
    ISOLATE_ENDORSEMENT_VALIDATION_ERROR_VERIFICATION_FAILED = 4;
    // Endorsement validity period is missing or invalid.
    ISOLATE_ENDORSEMENT_VALIDATION_ERROR_INVALID_VALIDITY_PERIOD = 5;
    // Package digest SHA256 in the endorsement does not match the expected
    // package digest.
    ISOLATE_ENDORSEMENT_VALIDATION_ERROR_PACKAGE_DIGEST_MISMATCH = 6;
  }

  // Validity period of the endorsement if validation succeeded. If absent,
  // consider the endorsement to be invalid.
  Validity validity = 1;
  // Validation error encountered, if any.
  IsolateEndorsementValidationError validation_error = 2;
  // Detailed error message if validation failed.
  string error_message = 3;
}
